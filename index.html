<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BUSCADOR IMPRESORAS</title>
  <style>
    :root{--blue:#0b63c8;--blue-2:#0f5ab0;--accent:#ff6a00;--bg:#f4f6fa;--card:#fff;--muted:#6b7280;--shadow:0 10px 24px rgba(0,0,0,.08);--radius:18px}
    *{box-sizing:border-box}
    body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:var(--bg);color:#0f172a}
    .wrap{max-width:1100px;margin:0 auto;padding:42px 20px 80px}
    h1{margin:0 0 20px;text-align:center;font-size:clamp(28px,4vw,46px);letter-spacing:.5px;color:var(--blue);font-weight:900}
    .searchbar{display:flex;gap:12px;justify-content:center;margin:10px auto 6px;max-width:860px}
    .searchbar input{flex:1;min-width:300px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px 16px;font-size:16px;outline:none;box-shadow:var(--shadow)}
    .btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;transition:.18s transform ease;box-shadow:var(--shadow)}
    .btn:active{transform:scale(.98)}
    .btn-clear{background:var(--accent);color:#fff}
    .btn-google{display:block;margin:22px auto 0;background:#d93025;color:#fff}
    .msg{text-align:center;color:#6b7280;min-height:20px;margin-bottom:6px;font-size:14px}
    .msg.err{color:#b91c1c}
    .grid{display:grid;gap:22px;grid-template-columns:1fr;margin-top:8px}
    @media (min-width:900px){.grid{grid-template-columns:1fr 1fr}}
    .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;border:1px solid #eef2f7}
    .card header{padding:16px 18px;background:linear-gradient(0deg,#fafcff,#ffffff);border-bottom:1px solid #eef2f7;font-weight:800;color:var(--blue-2);display:flex;justify-content:space-between;align-items:center}
    .count{color:#64748b;font-weight:700;font-size:14px}
    .card .body{padding:18px;min-height:220px;color:#111827;line-height:1.45}
    footer{margin-top:32px;text-align:center;color:#94a3b8;font-size:12px}
    ul{margin:0;padding-left:18px} li{margin:.3rem 0}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>BUSCADOR IMPRESORAS</h1>

    <div class="searchbar">
      <input id="q" type="text" placeholder="Modelo o referencia (p. ej. TS3350, TR 4751, DeskJet 3747, PG-545…)" autocomplete="off">
      <button id="clear" class="btn btn-clear">Limpiar</button>
    </div>
    <div id="msg" class="msg"></div>

    <div class="grid">
      <section class="card">
        <header><span>CONSUMIBLES</span><span id="count-cons" class="count">—</span></header>
        <div id="consumibles" class="body">—</div>
      </section>
      <section class="card">
        <header><span>CAPACIDAD</span><span id="count-cap" class="count">—</span></header>
        <div id="capacidad" class="body">—</div>
      </section>
    </div>

    <button id="google" class="btn btn-google">Buscar en Google</button>

    <footer>© 2025 — Buscador de consumibles y capacidades</footer>
  </div>

<script>
(() => {
  const $  = s => document.querySelector(s);
  const input = $('#q'), outCons = $('#consumibles'), outCap = $('#capacidad');
  const cntCons = $('#count-cons'), cntCap = $('#count-cap'), msgEl = $('#msg');
  const btnClear = $('#clear'), btnGoogle = document.querySelector('.btn-google');

  // Lista de JSON por marca (colócalos junto a index.html)
  const FILES = [
    'dataset_canon.json',
    'dataset_hp.json',
    'dataset_epson.json',
    'dataset_brother.json',
    'dataset_lexmark.json',
    'dataset_xerox.json',
    'dataset_otros.json'
  ];

  let DATA = [];

  const deburr = s => (s||'').toLowerCase()
    .normalize('NFD').replace(/[\\u0300-\\u036f]/g,'')
    .replace(/<[^>]*>/g,' ')
    .replace(/\\s+/g,' ')
    .trim();

  const first = (o, ks) => {
    for (const k of ks){
      if (o && o[k] != null && o[k] !== '') return String(o[k]);
      const K = k.toUpperCase?.() || k;
      if (o && o[K] != null && o[K] !== '') return String(o[K]);
    }
    return '';
  };

  async function loadAll(){
    const all = [];
    for (const f of FILES){
      try{
        const r = await fetch(f, {cache:'no-store'});
        if (r.ok){
          const j = await r.json();
          if (Array.isArray(j)) all.push(...j);
        }
      }catch(_){/* ignore */}
    }
    DATA = all;
    console.log('Registros cargados:', DATA.length);
  }

  function render(cons, cap){
    const list = a => a.length ? '<ul>'+a.map(v=>'<li>'+escapeHtml(v)+'</li>').join('')+'</ul>' : '—';
    outCons.innerHTML = list(cons);
    outCap.innerHTML  = list(cap);
    cntCons.textContent = String(cons.length || 0);
    cntCap.textContent  = String(cap.length || 0);
  }

  function escapeHtml(s){ return String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m])); }
  function msg(t='', err=false){ msgEl.textContent = t; msgEl.classList.toggle('err', !!err); }

  function search(){
    const raw = input.value.trim();
    msg('');
    if (!raw){ render([],[]); return; }
    const q = deburr(raw);

    const hits = [];
    for (const row of DATA){
      const compat = deburr(first(row, ['compatibilidades']));
      const desc   = deburr(first(row, ['descripcion','descripción']));
      const ref    = deburr(first(row, ['referencia']));
      if (compat.includes(q) || desc.includes(q) || ref.includes(q)) hits.push(row);
    }

    if (!hits.length){
      render([],[]);
      msg('Modelo no encontrado. Pincha en el botón Google.', true);
      return;
    }

    const setC = new Set(), setK = new Set();
    for (const r of hits){
      const cons = first(r, ['consumibles']);
      const cap  = first(r, ['capacidad']);
      cons && cons.split(/\\s*[;,\\/|]\\s*/).forEach(v => v && setC.add(v));
      cap  && cap.split(/\\s*[;,\\/|]\\s*/).forEach(v => v && setK.add(v));
    }
    render(Array.from(setC), Array.from(setK));
  }

  btnClear.addEventListener('click', ()=>{ input.value=''; render([],[]); msg(''); input.focus(); });
  input.addEventListener('keydown', e => { if (e.key==='Enter') search(); });
  btnGoogle.addEventListener('click', ()=>{ const v=input.value.trim(); if(v) window.open('https://www.google.com/search?q='+encodeURIComponent(v), '_blank'); });

  loadAll();
})();
</script>
</body>
</html>
