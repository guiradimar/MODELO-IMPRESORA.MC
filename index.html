<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUSCADOR IMPRESORAS</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: linear-gradient(135deg, #00b4db, #0083b0);
        color: #333;
    }
    h1 {
        text-align: center;
        color: white;
        margin-top: 20px;
    }
    .container {
        max-width: 900px;
        margin: auto;
        padding: 20px;
    }
    .search-bar {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
    }
    input, select, button {
        padding: 10px;
        border-radius: 6px;
        border: none;
        font-size: 16px;
    }
    input {
        flex: 2;
    }
    select {
        flex: 1;
    }
    button {
        cursor: pointer;
    }
    .btn-buscar {
        background-color: #0066cc;
        color: white;
    }
    .btn-limpiar {
        background-color: orange;
        color: white;
    }
    .results {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
    }
    .card {
        flex: 1;
        background-color: white;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0px 2px 5px rgba(0,0,0,0.2);
        min-width: 250px;
    }
    .card h2 {
        font-size: 18px;
        margin-bottom: 10px;
        border-bottom: 2px solid #eee;
        padding-bottom: 5px;
    }
    ul {
        padding-left: 20px;
        list-style-type: disc;
    }
    .google-btn {
        display: block;
        margin: 20px auto;
        padding: 10px 15px;
        background-color: red;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
    }
    .mensaje-error {
        text-align: center;
        color: white;
        font-weight: bold;
        margin-bottom: 10px;
    }
</style>
</head>
<body>
    <h1>BUSCADOR IMPRESORAS</h1>
    <div class="container">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Introduce modelo de impresora...">
            <button class="btn-buscar" onclick="buscar()">Buscar</button>
            <button class="btn-limpiar" onclick="limpiar()">Limpiar</button>
        </div>
        <p id="mensaje" class="mensaje-error"></p>
        <div class="results">
            <div class="card">
                <h2>CONSUMIBLES</h2>
                <ul id="consumibles"></ul>
            </div>
            <div class="card">
                <h2>CAPACIDAD</h2>
                <ul id="capacidades"></ul>
            </div>
        </div>
        <button class="google-btn" onclick="buscarGoogle()">Buscar en Google</button>
    </div>

<script>
async function cargarDatos() {
    const response = await fetch('listado_precios.csv');
    const data = await response.text();
    const filas = data.split('\n').map(fila => fila.split(','));
    const cabeceras = filas[0];
    return filas.slice(1).map(f => {
        let obj = {};
        cabeceras.forEach((col, i) => obj[col.trim()] = f[i] ? f[i].trim() : '');
        return obj;
    });
}

async function buscar() {
    const input = document.getElementById('searchInput').value.trim().toLowerCase();
    const mensaje = document.getElementById('mensaje');
    const consumiblesLista = document.getElementById('consumibles');
    const capacidadesLista = document.getElementById('capacidades');
    consumiblesLista.innerHTML = '';
    capacidadesLista.innerHTML = '';
    mensaje.textContent = '';

    if (!input) {
        mensaje.textContent = "Introduce un modelo para buscar.";
        return;
    }

    const datos = await cargarDatos();
    const encontrados = datos.filter(item => 
        item.Compatibilidades.toLowerCase().includes(input) || 
        item.Descripción.toLowerCase().includes(input)
    );

    if (encontrados.length === 0) {
        mensaje.textContent = "Modelo no encontrado. Pincha en el botón Google.";
        return;
    }

    const consumiblesSet = new Set();
    const capacidadesSet = new Set();

    encontrados.forEach(item => {
        if (item.Referencia) consumiblesSet.add(item.Referencia);
        if (item.Consumibles) consumiblesSet.add(item.Consumibles);
        if (item.Capacidad) capacidadesSet.add(item.Capacidad);
    });

    consumiblesSet.forEach(c => {
        if (c) {
            let li = document.createElement('li');
            li.textContent = c;
            consumiblesLista.appendChild(li);
        }
    });

    capacidadesSet.forEach(cap => {
        if (cap) {
            let li = document.createElement('li');
            li.textContent = cap;
            capacidadesLista.appendChild(li);
        }
    });
}

function limpiar() {
    document.getElementById('searchInput').value = '';
    document.getElementById('consumibles').innerHTML = '';
    document.getElementById('capacidades').innerHTML = '';
    document.getElementById('mensaje').textContent = '';
}

function buscarGoogle() {
    const input = document.getElementById('searchInput').value.trim();
    if (input) {
        window.open(`https://www.google.com/search?q=${encodeURIComponent(input)} impresora`, '_blank');
    }
}
</script>
</body>
</html>
