<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Buscador de consumibles</title>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js" defer></script>
<style>
body{font-family:Arial, sans-serif;margin:40px;background:#f5f5f5}
#search{padding:8px;font-size:16px;width:260px}
button{padding:8px 12px;margin-left:4px}
#cols{display:flex;gap:40px;margin-top:20px}
.col{flex:1;background:#fff;border:1px solid #ccc;border-radius:6px;padding:10px}
.col h2{margin-top:0;font-size:18px;text-align:center}
.col ul{list-style:disc;padding-left:20px}
.col li{margin-bottom:6px}
</style>
</head>
<body>
<h1>Buscador de consumibles</h1>
<input id="search" type="text" placeholder="Referencia o modelo" autocomplete="off" />
<button id="clear">Limpiar</button>
<div id="cols">
  <div class="col">
    <h2>Consumibles</h2>
    <ul id="consumibles"><li>Sin resultados</li></ul>
  </div>
  <div class="col">
    <h2>Capacidad</h2>
    <ul id="capacidades"><li>Sin resultados</li></ul>
  </div>
</div>
<script>
function normalizar(t){
  return (t||"").toString().toLowerCase()
    .normalize("NFD").replace(/[^\p{Letter}\p{Number}]+/gu," ")
    .replace(/\s+/g," ").trim();
}
let datos=[];
window.addEventListener("DOMContentLoaded",()=>{
  Papa.parse("listado_precios_28-07-2025.csv",{
    download:true,
    header:true,
    delimiter:";",
    skipEmptyLines:true,
    complete:(res)=>{
      datos=res.data.map(r=>({
        ref:r.REFERENCIA||"",
        consumibles:r.CONSUMIBLES||"",
        capacidad:r.CAPACIDAD||"",
        blob:normalizar((r.REFERENCIA||"")+" "+(r.DESCRIPCION||"")+" "+(r.COMPATIBILIDADES||""))
      }));
    }
  });
  document.getElementById('search').addEventListener('input',buscar);
  document.getElementById('clear').addEventListener('click',()=>{document.getElementById('search').value='';buscar();});
});
function buscar(){
  const q=normalizar(document.getElementById('search').value);
  if(!q){mostrar([],[]);return;}
  const hits=datos.filter(d=>d.blob.includes(q));
  const cons=new Set();
  const caps=new Set();
  hits.forEach(h=>{
    h.consumibles.split(/\s*[;,/|]\s*/).filter(Boolean).forEach(x=>cons.add(x));
    h.capacidad.split(/\s*[;,/|]\s*/).filter(Boolean).forEach(x=>caps.add(x));
  });
  mostrar([...cons],[...caps]);
}
function mostrar(cons,caps){
  const c=document.getElementById('consumibles');
  const k=document.getElementById('capacidades');
  c.innerHTML=cons.length?cons.map(x=>`<li>${x}</li>`).join(''):'<li>Sin resultados</li>';
  k.innerHTML=caps.length?caps.map(x=>`<li>${x}</li>`).join(''):'<li>Sin resultados</li>';
}
</script>
</body>
</html>
