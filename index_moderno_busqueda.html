<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buscador de Consumibles e Impresoras</title>
  <meta name="color-scheme" content="light dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: #0b1020;
      --bg-soft: #0f172a;
      --card: #0b1220;
      --ink: #e5e7eb;
      --muted: #9aa3b2;
      --primary: #e11d48; /* rojo marca */
      --ring: rgba(225,29,72,.35);
      --border: #1f2937;
      --chip: #121a2c;
    }
    @media (prefers-color-scheme: light) {
      :root{
        --bg: #f6f7fb; --bg-soft:#eef2ff; --card:#ffffff; --ink:#0f172a; --muted:#6b7280; --border:#e5e7eb; --chip:#f8fafc;
      }
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial;
      color:var(--ink); background:
        radial-gradient(900px 500px at 10% -10%, rgba(225,29,72,.12), transparent 60%),
        radial-gradient(900px 500px at 90% -10%, rgba(59,130,246,.10), transparent 60%),
        var(--bg);
    }
    .wrap{max-width:1100px; margin:40px auto; padding:0 16px}
    header{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:14px}
    header h1{margin:0; font-size:clamp(22px,3.2vw,36px); letter-spacing:-0.02em}
    header p{margin:4px 0 0; color:var(--muted)}

    .searchbox{background:var(--card); border:1px solid var(--border); border-radius:18px; padding:16px; box-shadow:0 20px 40px rgba(2,6,23,.15)}
    .row{display:grid; grid-template-columns:1fr auto auto; gap:10px}
    .controls{display:flex; gap:10px}
    input[type="text"]{
      width:100%; font-size:16px; padding:14px 14px 14px 44px; border-radius:12px; border:1px solid var(--border); outline:none; background:transparent;
      background: var(--card) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="%239aa3b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="7"/><path d="m20 20-4.3-4.3"/></svg>') no-repeat 12px center;
      color:var(--ink);
    }
    input[type="text"]::placeholder{color:var(--muted)}
    input[type="text"]:focus{border-color:var(--primary); box-shadow:0 0 0 6px var(--ring)}

    button{display:inline-flex; align-items:center; gap:8px; border:none; border-radius:12px; padding:10px 14px; font-weight:600; cursor:pointer; transition:.2s transform ease,.2s opacity ease}
    button:active{transform:translateY(1px)}
    .btn-primary{background:var(--primary); color:#fff}
    .btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--border)}

    .hint{color:var(--muted); font-size:12px; margin-top:8px}

    .toolbar{display:flex; align-items:center; justify-content:space-between; margin:14px 2px 8px}
    .count{color:var(--muted); font-size:13px}

    .results{display:grid; gap:14px; margin-top:8px}
    .card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; box-shadow:0 10px 30px rgba(2,6,23,.1)}
    .refline{display:flex; align-items:center; gap:12px}
    .brandicon{width:32px; height:32px; object-fit:contain}
    .ref{font-size:18px; font-weight:700; letter-spacing:.2px}
    .meta{color:var(--muted); font-size:13px}
    .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
    .chip{background:var(--chip); border:1px solid var(--border); border-radius:999px; padding:6px 10px; font-size:12px; cursor:pointer}

    .empty{color:var(--muted); text-align:center; padding:28px}
    .empty a{display:inline-flex; align-items:center; gap:8px; margin-top:8px}

    .footerhint{color:var(--muted); font-size:12px; text-align:center; margin-top:16px}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Buscador de Consumibles e Impresoras</h1>
        <p>Escribe una <b>referencia</b> de cartucho/toner o un <b>modelo de impresora</b>. Busca también por <i>parte</i> del nombre.</p>
      </div>
    </header>

    <section class="searchbox" role="search">
      <div class="row">
        <input id="q" type="text" placeholder="Ej.: 305XL, TN-2420, Canon MG3650, HP Laser 107..." list="sugs" autocomplete="off" />
        <div class="controls">
          <button id="btn" class="btn-primary" title="Buscar">
            <span class="material-symbols-rounded" aria-hidden="true">search</span>Buscar
          </button>
          <button id="clear" class="btn-ghost" title="Limpiar">
            <span class="material-symbols-rounded" aria-hidden="true">close</span>Limpiar
          </button>
        </div>
      </div>
      <datalist id="sugs"></datalist>
      <div class="hint">Consejo: prueba sin acentos ni guiones (p. ej. “MG36” o “107a”).</div>
    </section>

    <div class="toolbar">
      <div class="count" id="count">&nbsp;</div>
    </div>

    <section class="results" id="results" aria-live="polite"></section>

    <div class="footerhint">Fuente de datos: <code id="src"></code></div>
  </div>

<script>
// ——— CONFIGURA AQUÍ ———
const DATA_URL = "compatibilidades_cartuchos.json"; // Ruta o URL del JSON
const LOGOS = {
  hp: "hp.png",
  canon: "canon.png",
  epson: "epson.png",
  brother: "brother.png",
  xerox: "xerox.png"
};

// ——— Utilidades de normalización ———
const norm = (s) => (s || "")
  .toLowerCase()
  .normalize("NFD").replace(/\p{Diacritic}/gu, "")
  .replace(/[.,;:()\[\]{}<>|\/\\\-_*+!?"'`~^%$#@&=]/g, " ")
  .replace(/\s+/g, " ")
  .trim();
const includes = (haystack, needle) => norm(haystack).includes(norm(needle));

// ——— Estado ———
let DATA = [];
let SUGS = new Set();

// ——— Carga de datos ———
async function load() {
  document.getElementById('src').textContent = DATA_URL;
  const res = await fetch(DATA_URL);
  DATA = await res.json();

  DATA.forEach(it => {
    if (it.referencia) SUGS.add(it.referencia);
    if (Array.isArray(it.compatibles)) it.compatibles.forEach(m => SUGS.add(m));
  });

  const dl = document.getElementById("sugs");
  [...SUGS].sort((a,b)=>a.localeCompare(b)).slice(0,6000).forEach(v => {
    const o = document.createElement("option");
    o.value = v; dl.appendChild(o);
  });
}

// ——— Render ———
function brandIcon(marca){
  const key = (marca||"").toLowerCase();
  const src = LOGOS[key];
  return src ? `<img class="brandicon" src="${src}" alt="${marca||''}">` : "";
}

function render(items, q) {
  const box = document.getElementById("results");
  const count = document.getElementById("count");
  if (!items.length) {
    count.textContent = "Sin resultados";
    const query = encodeURIComponent(q||"");
    box.innerHTML = `
      <div class="card empty">
        <div>No encontramos coincidencias para <b>${q||''}</b>.</div>
        <a class="btn-ghost" href="https://www.google.com/search?q=${query}" target="_blank" rel="noopener">
          🔎 Buscar en Google
        </a>
      </div>`;
    return;
  }

  count.textContent = `${items.length} resultado${items.length!==1?'s':''}`;
  box.innerHTML = items.map(it => {
    const chips = (it.compatibles||[]).map(c => `<span class="chip" data-chip="${c}">${c}</span>`).join("");
    return `
      <article class="card">
        <div class="refline">
          ${brandIcon(it.marca)}
          <div>
            <div class="ref">${it.referencia||''} <span class="meta">(${it.marca||'—'})</span></div>
            <div class="meta">${it.descripcion||''}</div>
          </div>
        </div>
        <div class="chips">${chips}</div>
      </article>`;
  }).join("");

  // chips clicables → nueva búsqueda
  box.querySelectorAll('[data-chip]').forEach(ch => {
    ch.addEventListener('click', () => {
      const v = ch.getAttribute('data-chip');
      document.getElementById('q').value = v;
      search(v);
    });
  });
}

// ——— Búsqueda ———
function search(q){
  const results = DATA.filter(it => {
    const hay = [it.referencia||'', it.descripcion||'', ...(Array.isArray(it.compatibles)?it.compatibles:[])].join(' | ');
    return includes(hay, q);
  });

  // Ordenar: coincidencia exacta por referencia primero; luego por longitud
  results.sort((a,b)=>{
    const ax = norm(a.referencia)===norm(q) ? 0:1;
    const bx = norm(b.referencia)===norm(q) ? 0:1;
    if (ax!==bx) return ax-bx;
    return (a.referencia||'').length - (b.referencia||'').length;
  });

  render(results, q);
}

// ——— Eventos UI ———
const input = document.getElementById('q');
const btn = document.getElementById('btn');
const clearBtn = document.getElementById('clear');

btn.addEventListener('click', () => search(input.value));
input.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ search(input.value) }});
input.addEventListener('change', (e)=> search(e.target.value));
clearBtn.addEventListener('click', ()=>{ input.value=''; render([], ''); input.focus(); document.getElementById('count').textContent=''; });

// Init
load().then(()=>{ render([], ''); });
</script>
</body>
</html>
